# Optionale, leichte Prometheus-Konfiguration (Betrieb). Laeuft im selben Docker-Netz wie die App und fragt die
# API intern ab (/metrics ist nach aussen per Caddy gesperrt). Das Token liegt als Datei, nicht in dieser Konfiguration.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /secrets/metrics_token
    static_configs:
      - targets: ["api:4000"]
