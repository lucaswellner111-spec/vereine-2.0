# Vorschau auf EINEM Server, ohne Domain, per HTTP ueber die IP.
# Nur zum Anschauen des Fortschritts - nicht fuer echte Nutzerdaten (kein TLS!).
# Start: cd ~/vereine && docker compose -f infra/deploy/docker-compose.preview.yml --env-file .env.preview up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vereine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vereine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vereine"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Reiner Cache/Zaehler-Speicher: kein Persistieren noetig, Speicher begrenzt (LRU).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Eigenes Redis fuer die Job-Warteschlange: BullMQ verlangt noeviction + Persistenz.
  # Getrennt vom Cache-Redis (allkeys-lru), damit Jobs nie verdraengt werden.
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vereine:${POSTGRES_PASSWORD}@postgres:5432/vereine
      API_PORT: "4000"
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      COOKIE_SECURE: ${COOKIE_SECURE:-false} # true, sobald HTTPS aktiv ist
      WEB_ORIGIN: ${WEB_ORIGIN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # Hintergrund-Worker (BullMQ): Erinnerungen, Aufraeumen, Massen-Benachrichtigungen.
  # Gleiches Image wie die API, anderer Startbefehl. Kann spaeter auf einen eigenen Server ziehen.
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://vereine:${POSTGRES_PASSWORD}@postgres:5432/vereine
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      WORKER_CONCURRENCY: "5"
    depends_on:
      api:
        condition: service_healthy # Migrationen laufen im API-Start

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./${CADDY_FILE:-Caddyfile.preview}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - api

volumes:
  pgdata:
  queuedata:
  caddy_data:
