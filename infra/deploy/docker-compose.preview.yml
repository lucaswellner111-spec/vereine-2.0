# Vorschau auf EINEM Server, ohne Domain, per HTTP ueber die IP.
# Nur zum Anschauen des Fortschritts - nicht fuer echte Nutzerdaten (kein TLS!).
# Start: cd ~/vereine && docker compose -f infra/deploy/docker-compose.preview.yml --env-file .env.preview up -d --build
# Image-Tags: IMAGE_TAG (Standard "local") wird von infra/ops/deploy.sh gesetzt; so ist ein Rollback ein anderes Tag.
# Logs: Docker behaelt je Container hoechstens ~30 MB (3 x 10 MB), damit die Platte nicht vollaeuft (keine Personendaten in Logs).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vereine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vereine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vereine"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Reiner Cache/Zaehler-Speicher: kein Persistieren noetig, Speicher begrenzt (LRU).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Eigenes Redis fuer die Job-Warteschlange: BullMQ verlangt noeviction + Persistenz.
  # Getrennt vom Cache-Redis (allkeys-lru), damit Jobs nie verdraengt werden.
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: vereine-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://vereine:${POSTGRES_PASSWORD}@postgres:5432/vereine
      API_PORT: "4000"
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      CHAT_MASTER_KEYS: ${CHAT_MASTER_KEYS:?CHAT_MASTER_KEYS in .env.preview setzen}
      CHAT_ACTIVE_KEY_VERSION: ${CHAT_ACTIVE_KEY_VERSION:-1}
      CHAT_DEFAULT_RETENTION_DAYS: ${CHAT_DEFAULT_RETENTION_DAYS:-365}
      COOKIE_SECURE: ${COOKIE_SECURE:-false} # true, sobald HTTPS aktiv ist
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      # Zwei-Faktor: 32 Byte base64 (openssl rand -base64 32). Verlust = 2FA-Geheimnisse unlesbar, Nutzer muessten 2FA neu einrichten.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      # Web-Push (VAPID, npx web-push generate-vapid-keys); leer = Push aus
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://klubnest.de}
      # Prometheus-Token fuer /metrics (leer = Route aus)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Mail (Scaleway TEM per SMTP, siehe docs/DATENSCHUTZ-LAUNCH.md). MAIL_DRIVER=log verschickt nichts und braucht
      # keine SMTP-Werte; bei smtp sind SMTP_HOST, SMTP_USER, SMTP_PASS und MAIL_FROM Pflicht (sonst bricht der Start ab).
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      # AVV-Zustimmung der Vereine erzwingen (docs/welle1/W1c-DOKU.md); leer = aus. Der Worker braucht es fuer den Import-Versand.
      AVV_REQUIRED: ${AVV_REQUIRED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Kostenbremse (leer = Standard 200/Tag, 3000/Monat)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-}
      MAIL_MONTHLY_LIMIT: ${MAIL_MONTHLY_LIMIT:-}
      # Links in Mails (Bestaetigung, Passwort, Einladung) zeigen auf die Web-Adresse
      APP_URL: ${WEB_ORIGIN:-}
      # Betriebsalarme (docs/BETRIEB.md): Mail an den Betreiber, Statusdatei der Sicherung (von backup.sh geschrieben)
      OPERATOR_ALERT_EMAIL: ${OPERATOR_ALERT_EMAIL:-}
      BACKUP_STATUS_FILE: /backup-status/status.json
      OPS_DISK_PATH: /data/media
    volumes:
      - mediadata:/data/media
      - ${BACKUP_STATUS_DIR:-/var/lib/vereine/status}:/backup-status:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # Hintergrund-Worker (BullMQ): Erinnerungen, Aufraeumen, Massen-Benachrichtigungen.
  # Gleiches Image wie die API, anderer Startbefehl. Kann spaeter auf einen eigenen Server ziehen.
  worker:
    image: vereine-api:${IMAGE_TAG:-local} # gleiches Image wie die API (wird mit dem Service api gebaut)
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://vereine:${POSTGRES_PASSWORD}@postgres:5432/vereine
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      CHAT_MASTER_KEYS: ${CHAT_MASTER_KEYS:?CHAT_MASTER_KEYS in .env.preview setzen}
      CHAT_ACTIVE_KEY_VERSION: ${CHAT_ACTIVE_KEY_VERSION:-1}
      CHAT_DEFAULT_RETENTION_DAYS: ${CHAT_DEFAULT_RETENTION_DAYS:-365}
      WORKER_CONCURRENCY: "5"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://klubnest.de}
      # Der Worker verschickt die Mails und baut Abmeldelinks/Adress-Hashes: braucht dasselbe Server-Geheimnis wie die API
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      # Mail (Scaleway TEM per SMTP, siehe docs/DATENSCHUTZ-LAUNCH.md). MAIL_DRIVER=log verschickt nichts und braucht
      # keine SMTP-Werte; bei smtp sind SMTP_HOST, SMTP_USER, SMTP_PASS und MAIL_FROM Pflicht (sonst bricht der Start ab).
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      # AVV-Zustimmung der Vereine erzwingen (docs/welle1/W1c-DOKU.md); leer = aus. Der Worker braucht es fuer den Import-Versand.
      AVV_REQUIRED: ${AVV_REQUIRED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # Kostenbremse (leer = Standard 200/Tag, 3000/Monat)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-}
      MAIL_MONTHLY_LIMIT: ${MAIL_MONTHLY_LIMIT:-}
      # Links in Mails (Bestaetigung, Passwort, Einladung) zeigen auf die Web-Adresse
      APP_URL: ${WEB_ORIGIN:-}
      # Betriebsalarme (docs/BETRIEB.md): Mail an den Betreiber, Statusdatei der Sicherung (von backup.sh geschrieben)
      OPERATOR_ALERT_EMAIL: ${OPERATOR_ALERT_EMAIL:-}
      BACKUP_STATUS_FILE: /backup-status/status.json
      OPS_DISK_PATH: /data/media
    volumes:
      - mediadata:/data/media
      - ${BACKUP_STATUS_DIR:-/var/lib/vereine/status}:/backup-status:ro
    depends_on:
      api:
        condition: service_healthy # Migrationen laufen im API-Start

  # WebSocket-Zustellung fuer den Chat. Eigener Container, kennt KEINE Chat-Schluessel und keine Inhalte
  # (liest nur Ereignis-IDs von Redis). Kann spaeter auf einen eigenen Server ziehen und mehrfach laufen.
  chat-gateway:
    image: vereine-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "apps/api/dist/chat-gateway.js"]
    environment:
      DATABASE_URL: postgresql://vereine:${POSTGRES_PASSWORD}@postgres:5432/vereine
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis-queue:6379
      CHAT_GATEWAY_PORT: "4100"
      WEB_ORIGIN: ${WEB_ORIGIN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      # Firmendaten und Indexierung werden beim Build eingebettet (Werte aus .env.preview bzw. Shell; leer = Platzhalter)
      args:
        NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-}
        NEXT_PUBLIC_LEGAL_COMPANY: ${NEXT_PUBLIC_LEGAL_COMPANY:-}
        NEXT_PUBLIC_LEGAL_FORM: ${NEXT_PUBLIC_LEGAL_FORM:-}
        NEXT_PUBLIC_LEGAL_STREET: ${NEXT_PUBLIC_LEGAL_STREET:-}
        NEXT_PUBLIC_LEGAL_POSTAL_CITY: ${NEXT_PUBLIC_LEGAL_POSTAL_CITY:-}
        NEXT_PUBLIC_LEGAL_COUNTRY: ${NEXT_PUBLIC_LEGAL_COUNTRY:-}
        NEXT_PUBLIC_LEGAL_REPRESENTATIVES: ${NEXT_PUBLIC_LEGAL_REPRESENTATIVES:-}
        NEXT_PUBLIC_LEGAL_REGISTER: ${NEXT_PUBLIC_LEGAL_REGISTER:-}
        NEXT_PUBLIC_LEGAL_VAT_ID: ${NEXT_PUBLIC_LEGAL_VAT_ID:-}
        NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL:-}
        NEXT_PUBLIC_LEGAL_PHONE: ${NEXT_PUBLIC_LEGAL_PHONE:-}
        NEXT_PUBLIC_LEGAL_DPO: ${NEXT_PUBLIC_LEGAL_DPO:-}
        NEXT_PUBLIC_LEGAL_DSA_EMAIL: ${NEXT_PUBLIC_LEGAL_DSA_EMAIL:-}
        NEXT_PUBLIC_LEGAL_AUTHORITY: ${NEXT_PUBLIC_LEGAL_AUTHORITY:-}
    image: vereine-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Server-Komponenten (oeffentliche Vereinsseite, Vereinsfinder) holen Daten direkt im Docker-Netz
      API_INTERNAL_URL: http://api:4000

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      STAGING_ALLOW_CIDR: ${STAGING_ALLOW_CIDR:-127.0.0.1/32}
    volumes:
      - ./${CADDY_FILE:-Caddyfile.preview}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
    depends_on:
      - web
      - api
      - chat-gateway

volumes:
  pgdata:
  mediadata:
  queuedata:
  caddy_data:
  caddy_logs:
