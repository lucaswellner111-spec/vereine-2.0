name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Nur Laufzeit-Abhaengigkeiten; Funde in reinen Entwicklungswerkzeugen (drizzle-kit/esbuild) blockieren nicht.
      - run: npm audit --omit=dev --audit-level=high

  # API-Tests gegen echtes Postgres (postgres-js-Treiber), damit Treiber-Unterschiede zu PGlite auffallen.
  api-postgres:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @vereine/shared
      - run: npm test -w @vereine/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @vereine/shared
      - run: npm run build -w @vereine/web
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
