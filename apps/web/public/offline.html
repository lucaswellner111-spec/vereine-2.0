<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Klubnest</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1511;color:#e9efe9;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  @media (prefers-color-scheme:light){body{background:#f6f7f5;color:#15201a}}
  h1{font-size:1.4rem;margin:0 0 .5rem} p{margin:0 0 1.2rem;opacity:.75}
  button{background:#1f7a4d;color:#fff;border:0;border-radius:10px;padding:.7rem 1.2rem;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
  <main>
    <h1>Keine Verbindung</h1>
    <p>Klubnest braucht eine Internetverbindung. Prüfe dein Netz und versuche es erneut.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
