# Nur fuer lokale Entwicklung. Produktion: siehe infra/ (Hetzner).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vereine
      POSTGRES_PASSWORD: vereine
      POSTGRES_DB: vereine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  meilidata:
